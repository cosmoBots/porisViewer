# Keeps the npm dependencies and the actions of the CI workflow up to date.
# Every pull request has to pass the CI workflow before it can merge, and a
# release only becomes a candidate after a week, so a bad release has time
# to be noticed and withdrawn first. Minor and patch updates arrive together
# in a single pull request; the actions are pinned by commit, and each pull
# request moves the commit and its version comment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    # Temporary: these packages are held at their current major version
    # until the code is migrated to the next one. Remove each entry when
    # that migration is done, and the list when it is empty.
    ignore:
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-vue'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-vue-jsx'
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-plugin-vue
        update-types: ['version-update:semver-major']
      - dependency-name: '@vue/eslint-config-prettier'
        update-types: ['version-update:semver-major']
      - dependency-name: pinia
        update-types: ['version-update:semver-major']
      - dependency-name: vue-router
        update-types: ['version-update:semver-major']
      - dependency-name: '@vuepic/vue-datepicker'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
